name: Release

# A release is made when VERSION changes on main (or by a v* tag, or manually).
on:
  push:
    branches: [ main ]
    paths: [ VERSION, .github/workflows/release.yml ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="$(cat VERSION | tr -d '[:space:]')"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          # skip only if this version is already fully released (packages attached)
          if [ "${GITHUB_REF_TYPE}" != tag ] && gh release view "v$V" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -q '\.ipk$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v$V already released"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: create release
        if: steps.v.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: nikki-fleet ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  packages:
    name: packages ${{ matrix.branch }}
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        branch: [ openwrt-24.10, openwrt-25.12 ]
    steps:
      - uses: actions/checkout@v6
      - run: cp -r openwrt/* .
      - uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-${{ matrix.branch }}
          FEEDNAME: nikki_fleet
          PACKAGES: nikki-fleet luci-app-nikki-fleet
          NO_REFRESH_CHECK: true
          INDEX: 0
      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la bin/packages/x86_64/nikki_fleet/
          # drop older files of the same packages so installers never see two versions
          pkgname() { case "$1" in *.ipk) echo "${1%%_*}";; *.apk) echo "$1" | sed -E 's/-[0-9][^-]*(-r[0-9]+)?\.apk$//';; esac; }
          for f in bin/packages/x86_64/nikki_fleet/*.ipk bin/packages/x86_64/nikki_fleet/*.apk; do
            [ -e "$f" ] || continue; b=$(basename "$f"); n=$(pkgname "$b"); ext=${b##*.}
            gh release view "${{ needs.meta.outputs.tag }}" -R "${{ github.repository }}" --json assets -q '.assets[].name' | while read -r a; do
              [ "${a##*.}" = "$ext" ] && [ "$(pkgname "$a")" = "$n" ] && [ "$a" != "$b" ] && gh release delete-asset "${{ needs.meta.outputs.tag }}" "$a" -y -R "${{ github.repository }}"
            done
          done
          gh release upload "${{ needs.meta.outputs.tag }}" $(ls bin/packages/x86_64/nikki_fleet/*.ipk bin/packages/x86_64/nikki_fleet/*.apk 2>/dev/null) --clobber -R "${{ github.repository }}"

  panel-binaries:
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: build
        working-directory: panel
        run: |
          V=${{ needs.meta.outputs.version }}
          mkdir -p ../dist
          for t in linux/amd64 linux/arm64 linux/arm/7; do
            os=${t%%/*}; rest=${t#*/}; arch=${rest%%/*}; arm=${rest#*/}; [ "$arm" = "$rest" ] && arm=""
            name=nikki-fleet-panel-${os}-${arch}${arm:+v$arm}
            GOOS=$os GOARCH=$arch GOARM=$arm CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$V" -o ../dist/$name .
          done
      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.meta.outputs.tag }}" ../dist/* --clobber -R "${{ github.repository }}"
        working-directory: panel

  docker:
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: panel
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nikki-fleet-panel:${{ needs.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/nikki-fleet-panel:latest
