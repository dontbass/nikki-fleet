name: Release

# A release is made when VERSION changes on main (or by a v* tag, or manually).
on:
  push:
    branches: [ main ]
    paths: [ VERSION, .github/workflows/release.yml ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="$(cat VERSION | tr -d '[:space:]')"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != tag ] && git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v$V already released"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  packages:
    name: packages ${{ matrix.branch }}
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [ openwrt-24.10, openwrt-25.12 ]
    steps:
      - uses: actions/checkout@v6
      - run: cp -r openwrt/* .
      - uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-${{ matrix.branch }}
          FEEDNAME: nikki_fleet
          PACKAGES: nikki-fleet luci-app-nikki-fleet
          EXTRA_FEEDS: src-git|nikki|https://github.com/nikkinikki-org/OpenWrt-nikki.git;main
          NO_REFRESH_CHECK: true
          INDEX: 0
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.branch }}
          path: |
            bin/packages/x86_64/nikki_fleet/*.ipk
            bin/packages/x86_64/nikki_fleet/*.apk
          if-no-files-found: error

  panel-binaries:
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: build
        working-directory: panel
        run: |
          V=${{ needs.meta.outputs.version }}
          mkdir -p ../dist
          for t in linux/amd64 linux/arm64 linux/arm/7; do
            os=${t%%/*}; rest=${t#*/}; arch=${rest%%/*}; arm=${rest#*/}; [ "$arm" = "$rest" ] && arm=""
            name=nikki-fleet-panel-${os}-${arch}${arm:+v$arm}
            GOOS=$os GOARCH=$arch GOARM=$arm CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$V" -o ../dist/$name .
          done
      - uses: actions/upload-artifact@v7
        with:
          name: panel-binaries
          path: dist/*

  docker:
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: panel
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nikki-fleet-panel:${{ needs.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/nikki-fleet-panel:latest

  release:
    needs: [ meta, packages, panel-binaries ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: nikki-fleet ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          generate_release_notes: true
